<!DOCTYPE html>
<!-- RootNet portal - default home page for the AE3 browser. Mission makers can replace/extend
     these bundled pages under addons/desktop/ui/web/sites/. -->
<html lang="en">
<head>
<meta charset="utf-8">
<title>RootNet</title>
<style>
  body { margin: 0; font-family: "Ubuntu", "Noto Sans", sans-serif; color: #222; background: #f6f6f6; }
  header { background: #2c001e; color: #fff; padding: 18px 26px; display: flex; align-items: center; gap: 12px; }
  header .logo { font-size: 26px; }
  header h1 { margin: 0; font-size: 22px; font-weight: 600; }
  header .tag { margin-left: auto; color: #e9bcd9; font-size: 13px; }
  .wrap { max-width: 920px; margin: 24px auto; padding: 0 20px; }
  .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(240px, 1fr)); gap: 16px; }
  .card { background: #fff; border: 1px solid #e2e2e2; border-radius: 10px; padding: 18px; }
  .card h3 { margin: 0 0 8px; color: #c7411f; }
  a { color: #e95420; text-decoration: none; } a:hover { text-decoration: underline; }
  .news li { margin: 6px 0; }
  footer { text-align: center; color: #999; font-size: 12px; padding: 24px; }
</style>
</head>
<body>
  <header>
    <span class="logo">🛰️</span>
    <h1>RootNet</h1>
    <span class="tag">Secure Intranet • AE3</span>
  </header>
  <div class="wrap">
    <div class="grid">
      <div class="card">
        <h3>Knowledge Base</h3>
        <p>System manuals and operator guides.</p>
        <p><a href="../wiki/index.html">Open Wiki →</a></p>
      </div>
      <div class="card">
        <h3>Directory</h3>
        <p>Personnel and node registry.</p>
        <p class="muted">No entries published.</p>
      </div>
      <div class="card">
        <h3>Status</h3>
        <ul class="news">
          <li>● Core services: online</li>
          <li>● Mail relay: online</li>
          <li>● Messenger: online</li>
        </ul>
      </div>
    </div>
  </div>
  <footer>RootNet • AE3 OS</footer>
</body>
</html>
